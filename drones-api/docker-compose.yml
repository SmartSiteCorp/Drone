services:
  db:
    image: postgres:16
    container_name: drones-api-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drones_api}
      POSTGRES_USER: ${POSTGRES_USER:-drones}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drones_password}
    ports:
      - "55432:5432"
    volumes:
      - drones_api_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

  mediamtx:
    image: bluenviron/mediamtx:1.21.2
    container_name: drones-api-mediamtx
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554/tcp"
      - "8888:8888/tcp"
      - "8889:8889/tcp"
      - "8189:8189/udp"
      - "8189:8189/tcp"

volumes:
  drones_api_pgdata:
